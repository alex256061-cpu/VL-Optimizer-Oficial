# Cloudflare Pages — configuração do projeto VL Optimizer
#
# Este arquivo diz ao Cloudflare Pages:
#   1. as rotas sem extensão (/entrar -> entrar.html), sem precisar de _redirects
#   2. o cabeçalho para não cachear o HTML (quem publicar sempre vê a versão nova)
#
# Functions ficam em functions/api/*.js e são detectadas automaticamente.

## Rotas amigáveis
# Usa o padrão de HTML do Pages: /entrar serve entrar.html quando não existe a pasta.

## Cache
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
