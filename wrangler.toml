# Configuração do Cloudflare Pages — VL Optimizer
#
# O wrangler avisou que falta o campo pages_build_output_dir. Ele serve para o wrangler
# saber qual pasta publicar quando o comando é rodado da raiz do projeto.
#
# Aqui o deploy é feito de dentro da pasta site/ (wrangler pages deploy .), então a pasta
# é o próprio ".". O campo abaixo deixa o aviso de fora e permite rodar da raiz também.

name = "vl-optimizer"
pages_build_output_dir = "site"
compatibility_date = "2026-11-12"

# Cabeçalhos
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
