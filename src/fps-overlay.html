<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>VL FPS</title>
  <style>
    /* Sem fundo: o contorno escuro no texto é o que garante leitura em céu claro ou cena escura. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
    body { display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; padding: 4px 6px; box-sizing: border-box; }
    body.right { align-items: flex-end; }
    body.bottom { justify-content: flex-end; }
    .ov {
      display: flex; flex-direction: column; gap: 1px;
      font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums;
      color: #fff; line-height: 1.15;
      text-shadow: 0 0 1px #000, 0 0 2px #000, 1px 1px 0 rgba(0,0,0,0.85), -1px -1px 0 rgba(0,0,0,0.6), 0 1px 4px rgba(0,0,0,0.7);
    }
    body.right .ov { align-items: flex-end; text-align: right; }
    .fps-row { display: flex; align-items: baseline; gap: 5px; }
    body.right .fps-row { flex-direction: row-reverse; }
    .fps { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; }
    .unit { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #ff9aa2; }
    .good { color: #6ee7b7; } .mid { color: #fcd34d; } .bad { color: #fda4af; }
    .line { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .k { color: #ff9aa2; font-weight: 800; letter-spacing: 0.04em; font-size: 11.5px; margin-right: 5px; }
    .dim { color: #e5e5ea; font-weight: 600; }
    .hot { color: #fda4af; } .warm { color: #fcd34d; }
    .name { font-size: 11px; font-weight: 600; color: #e5e5ea; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmp { font-size: 12.5px; font-weight: 700; white-space: nowrap; margin-top: 1px; }
    .cmp .up { color: #6ee7b7; } .cmp .down { color: #fda4af; }
  </style>
</head>
<body>
  <div class="ov" id="ov">
    <div class="fps-row"><span class="fps" id="fps">--</span><span class="unit">FPS</span></div>
    <div class="line" id="ft" hidden></div>
    <div class="line" id="cpu" hidden></div>
    <div class="line" id="gpu" hidden></div>
    <div class="line" id="ram" hidden></div>
    <div class="cmp" id="cmp" hidden></div>
    <div class="name" id="name" hidden></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const temp = (t) => t == null ? '' : ` <span class="${t >= 85 ? 'hot' : t >= 75 ? 'warm' : 'dim'}">${t}°C</span>`;
    function line(el, html) { el.hidden = !html; if (html) el.innerHTML = html; }

    function render(d) {
      const live = d.live, s = d.show || {}, sys = d.sys || {};
      document.body.classList.toggle('right', !!d.right);
      document.body.classList.toggle('bottom', !!d.bottom);

      $('fps').textContent = live ? live.fps : '--';
      $('fps').className = 'fps' + (live ? ' ' + (live.fps >= 100 ? 'good' : live.fps >= 50 ? 'mid' : 'bad') : '');

      const ft = [];
      if (live && s.frametime) ft.push(`<span class="k">MS</span>${live.frametime.toFixed(1)}`);
      if (live && s.low1) ft.push(`<span class="k">1%</span>${live.low1}`);
      line($('ft'), ft.join('&nbsp;&nbsp;'));

      const cpuOn = (s.cpu && sys.cpu != null) || (s.cpuTemp && sys.cpuTemp != null);
      line($('cpu'), cpuOn ? `<span class="k">CPU</span>${s.cpu && sys.cpu != null ? sys.cpu + '%' : ''}${s.cpuTemp ? temp(sys.cpuTemp) : ''}` : '');
      const gpuOn = (s.gpu && sys.gpu != null) || (s.gpuTemp && sys.gpuTemp != null);
      line($('gpu'), gpuOn ? `<span class="k">GPU</span>${s.gpu && sys.gpu != null ? sys.gpu + '%' : ''}${s.gpuTemp ? temp(sys.gpuTemp) : ''}` : '');
      line($('ram'), s.ram && sys.ramUsed != null ? `<span class="k">RAM</span>${sys.ramUsed.toFixed(1)} <span class="dim">/ ${sys.ramTotal} GB</span>` : '');

      const b = live && live.base;
      if (b) {
        if (b.fresh) line($('cmp'), `<span class="k">BASE</span>${Math.round(b.fps)} FPS`);
        else {
          const g = b.gain, cls = g == null || Math.abs(g) < 3 ? '' : g > 0 ? 'up' : 'down';
          line($('cmp'), `<span class="k">BASE</span>${Math.round(b.fps)} → ${b.now} <span class="${cls}">${g == null ? '--' : (g > 0 ? '+' : '') + g.toFixed(0) + '%'}</span>`);
        }
      } else line($('cmp'), '');

      line($('name'), s.name ? esc(live ? live.name.replace(/\.exe$/i, '') : 'Aguardando jogo…') : '');
    }

    if (window.electron && window.electron.on) window.electron.on('overlay-update', (d) => { if (d) render(d); });
  </script>
</body>
</html>
