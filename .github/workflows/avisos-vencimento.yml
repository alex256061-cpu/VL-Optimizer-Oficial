# Avisos de vencimento por e-mail (roda 1x por dia)
# Configure os secrets no GitHub: VL_AVISOS_URL e VL_CRON_KEY (veja AVISOS-EMAIL.md)
name: Avisos de vencimento

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC = 09:00 de Brasília
  workflow_dispatch: {}

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ver se os avisos estão configurados
        env:
          VL_AVISOS_URL: ${{ secrets.VL_AVISOS_URL }}
          VL_CRON_KEY: ${{ secrets.VL_CRON_KEY }}
        run: |
          # Enquanto o e-mail/cron não estiver configurado, não falhar o workflow
          # (evita e-mail de "Run failed" todo dia). Quando os dois secrets
          # existirem, o passo de baixo chama o cron normalmente.
          if [ -z "$VL_AVISOS_URL" ] || [ -z "$VL_CRON_KEY" ]; then
            echo "Avisos de vencimento ainda não configurados; nada a fazer."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        id: config

      - name: Chamar o cron do VL Optimizer
        if: steps.config.outputs.configured == 'true'
        env:
          VL_AVISOS_URL: ${{ secrets.VL_AVISOS_URL }}
          VL_CRON_KEY: ${{ secrets.VL_CRON_KEY }}
        run: |
          curl -fsS -X POST "$VL_AVISOS_URL" \
            -H "x-cron-key: $VL_CRON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
